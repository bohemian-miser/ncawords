<!DOCTYPE html>
<!--
  Headless-browser harness for docs/fiddle.js.

  It stands in for lenia.html: no gallery, no bucket. `getMethod`/`getTracker`
  return null (the "no card for this run" path fiddle.js must survive), and
  window.fetch is stubbed so any '<run>/weights.json' resolves to the
  dummy_0058 NCA fixture. Everything the driver pokes hangs off window.__fiddle.

  Serve it, don't file:// it — fiddle.js is an ES module:
    python3 -m http.server 8791 --directory docs
    http://localhost:8791/test/fiddle_harness.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>fiddle.js harness</title>
<style>
  body { background:#121212; color:#ddd; font-family:sans-serif; margin:0; padding:20px; }
  /* The bits of dashboard.css that fiddle.js's modal actually depends on. */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8);
    z-index:1000; overflow-y:auto; padding:40px 0; }
  .modal-content { position:relative; background:#1e1e1e; margin:0 auto; padding:30px;
    border-radius:8px; max-width:900px; }
  .modal-close { position:absolute; top:10px; right:16px; font-size:1.6em; color:#888; cursor:pointer; }
  .img-container { background:#2a2a2a; display:flex; align-items:center; justify-content:center;
    overflow:hidden; border-radius:4px; }
  .img-container img { max-width:100%; max-height:100%; }
  .sub-desc { color:#888; font-size:0.8em; }
</style>
</head>
<body>
<h1 style="color:#4db8ff;font-size:1.1em;">fiddle.js harness</h1>
<div id="status" class="sub-desc">booting…</div>

<script type="module">
import { initFiddle, openFiddleModal, handleFiddleHash,
         diffWeights, applyPatch, encodeFiddle, decodeFiddle } from '../fiddle.js?v=lenia-17';

const FAKE_RUN = 'testrun';

// Pull the fixture with the REAL fetch before replacing it.
const fixture = await (await fetch('../test/dummy_0058.json')).json();

const realFetch = window.fetch.bind(window);
window.__fetchLog = [];
window.fetch = async (input, init) => {
    const url = String(typeof input === 'string' ? input : (input && input.url) || '');
    window.__fetchLog.push(url);
    const path = url.split('?')[0];
    if (path.endsWith('/weights.json')) {
        return new Response(JSON.stringify(fixture),
            { status: 200, headers: { 'Content-Type': 'application/json' } });
    }
    if (path.endsWith('/run.json')) {
        return new Response(JSON.stringify({
            args: { steps: 5000, lr: 0.002 },
            tags: ['harness'],
            text: 'harness fixture run',
            losses: [[100, 0.5], [200, 0.25]]
        }), { status: 200, headers: { 'Content-Type': 'application/json' } });
    }
    // target.png etc. — nothing else should be needed; 404 the rest.
    return new Response('', { status: 404 });
};

initFiddle({
    getMethod: () => null,
    getTracker: () => null,
    bucketBase: 'https://bucket.invalid/'
});

window.__fiddle = {
    openFiddleModal, handleFiddleHash,
    diffWeights, applyPatch, encodeFiddle, decodeFiddle,
    fixture, FAKE_RUN
};
window.__ready = true;
document.getElementById('status').textContent =
    'ready — fetch stubbed, fixture channel_n=' + fixture.channel_n;
</script>
</body>
</html>
